services:
  inventory:
    build: .
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8084}:8080"
    environment:
      DATABASE_PATH: /data/inventory.sqlite3
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-JpkAdmin2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/superuser/jpkinventory-data}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
