<script>
(() => {
'use strict';
const sites = [{id:'HQ',name:'ลาดพร้าว',detail:'สำนักงานใหญ่ · ศูนย์กลางระบบไอที'},{id:'AKM',name:'เอกมัย',detail:'สำนักงานสาขาเอกมัย'},{id:'RYT',name:'รัชโยธิน',detail:'สำนักงานสาขารัชโยธิน'},{id:'RST',name:'รังสิต',detail:'สำนักงานสาขารังสิต'}];
const types = {server:'Server',pc:'PC',notebook:'Notebook',nas:'NAS',router:'Router',other:'อื่นๆ'};
const permissions = ['Read','Write','Read/Write'];
function seed() {
 const users = [{id:'u1',name:'กานต์ ธนากุล',department:'เทคโนโลยีสารสนเทศ',site:'HQ',contact:'kant@example.test'},{id:'u2',name:'พิมพ์ชนก วงศ์ดี',department:'บัญชี',site:'HQ',contact:'pim@example.test'},{id:'u3',name:'ณัฐพล สุขใจ',department:'ฝ่ายขาย',site:'AKM',contact:'nat@example.test'},{id:'u4',name:'อรทัย ใจดี',department:'ปฏิบัติการ',site:'RYT',contact:'orn@example.test'},{id:'u5',name:'ธนวัฒน์ พูนผล',department:'บุคคล',site:'RST',contact:'tan@example.test'}];
 const base = {mac:'',os:'',startMA:'',endMA:'',ownerId:'',folders:[],model:'',notes:''};
 const devices = sites.map((s,i)=>({...base,id:`r${i}`,hostname:`${s.id}-RTR-01`,type:'router',site:s.id,ip:`192.168.${i+10}.1`,mac:`02:00:00:00:0${i}:01`,model:i===0?'MikroTik RB5009':'MikroTik hEX S',notes:'Gateway ประจำสาขา'}));
 devices.push({...base,id:'s1',hostname:'HQ-SRV-01',type:'server',site:'HQ',ip:'192.168.10.10',model:'Dell PowerEdge R350',notes:'ระบบงานภายใน'},{...base,id:'n1',hostname:'HQ-NAS-01',type:'nas',site:'HQ',ip:'192.168.10.20',model:'Synology DS923+',notes:'พื้นที่จัดเก็บไฟล์ส่วนกลาง'});
 users.forEach((u,i)=>devices.push({...base,id:`d${i}`,hostname:`${u.site}-${i%2?'PC':'NB'}-01`,type:i%2?'pc':'notebook',site:u.site,ip:`192.168.${sites.findIndex(s=>s.id===u.site)+10}.${101+i}`,mac:`02:AA:BB:CC:DD:0${i}`,os:'Windows 11 Pro',startMA:'2026-01-01',endMA:i===1?'2026-10-01':'2027-12-31',ownerId:u.id,model:i%2?'Dell OptiPlex 7010':'Lenovo ThinkPad E14',folders:[{name:'Shared',permission:'Read'},{name:u.department,permission:'Read/Write'}]}));
 devices.forEach(d=>d.antivirusActive=['pc','notebook','server'].includes(d.type)?'yes':null);
 return migrate({version:1,users,devices});
}
function validateDevice(d, users, availableSites=sites) {
 const errors={};
 if(!d.hostname?.trim()) errors.hostname='กรุณาระบุชื่อ / Hostname';
 if(!Object.hasOwn(types,d.type)) errors.type='ประเภทอุปกรณ์ไม่ถูกต้อง';
 if(!availableSites.some(s=>s.id===d.site)) errors.site='กรุณาเลือก Site';
 if(['server','nas'].includes(d.type)&&d.site!=='HQ') errors.site='Server และ NAS ต้องอยู่ที่ HQ เท่านั้น';
 if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(d.ip)||d.ip.split('.').some(n=>Number(n)>255)) errors.ip='กรุณาระบุ IPv4 เช่น 192.168.10.100 (แต่ละส่วน 0–255)';
 if(d.mac&&!/^([0-9a-f]{2}:){5}[0-9a-f]{2}$/i.test(d.mac)&&!/^([0-9a-f]{2}-){5}[0-9a-f]{2}$/i.test(d.mac)) errors.mac='ใช้รูปแบบ AA:BB:CC:DD:EE:FF หรือ AA-BB-CC-DD-EE-FF';
 if(d.ownerId&&!users.some(u=>u.id===d.ownerId)) errors.ownerId='ไม่พบผู้ใช้งานที่เลือก';
 if(d.type==='other'&&!d.customType?.trim()) errors.customType='กรุณาระบุชื่อประเภทอุปกรณ์';
 if(['pc','notebook','server'].includes(d.type)&&!['yes','no'].includes(d.antivirusActive)) errors.antivirusActive='กรุณาเลือก Antivirus active เป็น Yes หรือ No';
 for(const key of ['startMA','endMA']) if(d[key]&&!isISODate(d[key])) errors[key]='กรุณาระบุวันที่ที่ถูกต้อง';
 if(d.startMA&&d.endMA&&d.endMA<d.startMA) errors.endMA='End MA ต้องไม่อยู่ก่อน Start MA';
 if(d.folders?.some(f=>!f.name.trim()||!permissions.includes(f.permission))) errors.folders='กรุณาระบุชื่อ Folder และ Permission ให้ครบ';
 return errors;
}

// Keep the original localStorage key; migration only adds missing fields in memory.
function migrate(raw) {
 if(!raw||![1,2].includes(raw.version)||!Array.isArray(raw.users)||!Array.isArray(raw.devices)) throw Error('โครงสร้างข้อมูลไม่ถูกต้อง');
 return {...raw,version:2,
  sites:raw.sites===undefined?sites.map(s=>({...s})):raw.sites,
  services:raw.services===undefined?[]:raw.services,
  issues:raw.issues===undefined?[]:raw.issues,
  users:raw.users.map(u=>({phone:'',notes:'',...u})),
  devices:raw.devices.map(d=>({customType:'',antivirusActive:null,...d}))};
}
function isISODate(value) {
 if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value)||value.startsWith('0000')) return false;
 const date=new Date(value+'T00:00:00Z');
 return !Number.isNaN(date.getTime())&&date.toISOString().slice(0,10)===value;
}
function validateSite(site, availableSites) {
 const errors={};
 if(!/^[A-Z0-9][A-Z0-9_-]{1,11}$/.test(site.id)) errors.id='ใช้รหัส 2–12 ตัว: A–Z, 0–9, - หรือ _';
 if(availableSites.some(s=>s.id.toUpperCase()===site.id.toUpperCase())) errors.id='รหัส Site นี้มีอยู่แล้ว';
 if(!site.name?.trim()) errors.name='กรุณาระบุชื่อสาขา';
 return errors;
}
function targetName(issue, data) {
 return (issue.targetKind==='device'?data.devices.find(d=>d.id===issue.targetId)?.hostname:issue.targetKind==='service'?data.services.find(s=>s.id===issue.targetId)?.name:null)||issue.targetName;
}
function reporterName(issue, data) {
 return (issue.reporterKind==='user'?data.users.find(u=>u.id===issue.reporterId)?.name:null)||issue.reporterName;
}
function validateIssue(issue, data) {
 const errors={};
 if(!isISODate(issue.occurredOn)) errors.occurredOn='กรุณาระบุวันที่เกิดปัญหาที่ถูกต้อง';
 if(issue.resolvedOn&&!isISODate(issue.resolvedOn)) errors.resolvedOn='กรุณาระบุวันที่แก้ปัญหาที่ถูกต้อง';
 if(isISODate(issue.occurredOn)&&isISODate(issue.resolvedOn)&&issue.resolvedOn<issue.occurredOn) errors.resolvedOn='วันที่แก้ปัญหาต้องไม่อยู่ก่อนวันที่เกิดปัญหา';
 if(!['device','service','other'].includes(issue.targetKind)) errors.target='กรุณาเลือกอุปกรณ์หรือ Service';
 else if(issue.targetKind==='other') {if(!issue.targetName?.trim()) errors.targetName='กรุณาระบุชื่ออุปกรณ์หรือ Service';}
 else if(!(issue.targetKind==='device'?data.devices:data.services).some(x=>x.id===issue.targetId)) errors.target='ไม่พบอุปกรณ์หรือ Service ที่เลือก';
 if(!['user','other'].includes(issue.reporterKind)) errors.reporter='กรุณาเลือกผู้แจ้ง';
 else if(issue.reporterKind==='other') {if(!issue.reporterName?.trim()) errors.reporterName='กรุณาระบุชื่อผู้แจ้ง';}
 else if(!data.users.some(u=>u.id===issue.reporterId)) errors.reporter='ไม่พบผู้แจ้งที่เลือก';
 if(!issue.notes?.trim()) errors.notes='กรุณาระบุรายละเอียดปัญหา';
 return errors;
}
function filterIssues(data, filters) {
 const q=(filters.query||'').toLocaleLowerCase();
 return data.issues.filter(issue=>{
  const status=issue.resolvedOn?'resolved':'open';
  const target=issue.targetKind==='other'?`other:${issue.targetName}`:`${issue.targetKind}:${issue.targetId}`;
  return (!filters.status||filters.status===status)&&(!filters.from||issue.occurredOn>=filters.from)&&(!filters.to||issue.occurredOn<=filters.to)&&(!filters.target||filters.target===target||(filters.target==='other'&&issue.targetKind==='other'))&&[targetName(issue,data),reporterName(issue,data),issue.notes].some(v=>v.toLocaleLowerCase().includes(q));
 }).sort((a,b)=>b.occurredOn.localeCompare(a.occurredOn));
}
// Preserve issue history when inventory records are removed.
function removeEntity(data, kind, id) {
 if(kind==='issue') return {...data,issues:data.issues.filter(x=>x.id!==id)};

 return {...data,devices:data.devices.filter(d=>d.id!==id),issues:data.issues.map(i=>i.targetKind==='device'&&i.targetId===id?{...i,targetKind:'other',targetId:'',targetName:targetName(i,data)}:i)};
}

const KEY='jpk-inventory:v1';
let serverMode=false, serverState=null, revision=null;
async function initializeStorage() {
 if(location.protocol==='file:') return;
 serverMode=true;
 const response=await fetch('/api/state',{cache:'no-store'});
 if(!response.ok) throw Error('ไม่สามารถเชื่อมต่อฐานข้อมูลบนเซิร์ฟเวอร์ได้');
 const result=await response.json();
 serverState=validateData(result.data);revision=result.revision;
}
function createId() {
 if(typeof crypto.randomUUID==='function') return crypto.randomUUID();
 const bytes=crypto.getRandomValues(new Uint8Array(16));
 bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
 const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}
function legacyData() {const raw=localStorage.getItem(KEY);return raw?validateData(JSON.parse(raw)):null;}
async function importData(raw) {
 if(!serverMode) throw Error('นำเข้าข้อมูลได้เมื่อเชื่อมต่อเซิร์ฟเวอร์เท่านั้น');
 return persist(validateData(raw),'/api/import','POST');
}
async function persist(data,url='/api/state',method='PUT') {
 const response=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,data})});
 const result=await response.json();
 if(!response.ok) throw Error(result.error||'บันทึกข้อมูลไม่สำเร็จ');
 serverState=validateData(result.data);revision=result.revision;
 return serverState;
}
function load() {
 if(serverMode) {if(!serverState)throw Error("Server data not loaded");return serverState;}
 const raw=localStorage.getItem(KEY);
 if(!raw) {const data=seed(); save(data); return data;}
 return validateData(JSON.parse(raw));
}
function validateData(raw) {
 const data=migrate(raw);
 if(!Array.isArray(data.sites)||!Array.isArray(data.services)||!Array.isArray(data.issues)) throw Error('โครงสร้างข้อมูลไม่ถูกต้อง');
 const siteIds=new Set();
 for(const s of data.sites) {
  if(!s||typeof s.id!=='string'||!/^[A-Z0-9][A-Z0-9_-]{1,11}$/.test(s.id)||siteIds.has(s.id)||typeof s.name!=='string'||!s.name.trim()||(s.detail!==undefined&&typeof s.detail!=='string')) throw Error('ข้อมูล Site ไม่ถูกต้อง');
  siteIds.add(s.id);
 }
 if(!siteIds.has('HQ')) throw Error('ไม่พบ HQ');
 const ids=new Set();
 for(const item of [...data.users,...data.devices,...data.services,...data.issues]) {if(!item||typeof item.id!=='string'||!item.id||ids.has(item.id)) throw Error('ข้อมูลรายการไม่ถูกต้อง'); ids.add(item.id);}
 for(const u of data.users) if(!['name','department','contact','phone','notes'].every(k=>typeof u[k]==='string')||!siteIds.has(u.site)) throw Error('ข้อมูลผู้ใช้ไม่ถูกต้อง');
 for(const s of data.services) if(typeof s.name!=='string'||!s.name.trim()) throw Error('ข้อมูล Service ไม่ถูกต้อง');
 for(const d of data.devices) if(!Object.hasOwn(types,d.type)||!siteIds.has(d.site)||!['hostname','ip','mac','os','startMA','endMA','ownerId','model','notes','customType'].every(k=>typeof d[k]==='string')||(d.type==='other'&&!d.customType.trim())||![null,'yes','no'].includes(d.antivirusActive)||!Array.isArray(d.folders)||d.folders.some(f=>!f||typeof f.name!=='string'||!permissions.includes(f.permission))||(['server','nas'].includes(d.type)&&d.site!=='HQ')||(d.ownerId&&!data.users.some(u=>u.id===d.ownerId))) throw Error('ข้อมูลอุปกรณ์ไม่ถูกต้อง');
 for(const i of data.issues) if(!['occurredOn','resolvedOn','targetKind','targetId','targetName','reporterKind','reporterId','reporterName','notes'].every(k=>typeof i[k]==='string')||Object.keys(validateIssue(i,data)).length) throw Error('ข้อมูล Issue Log ไม่ถูกต้อง');
 return data;
}
function save(data) {if(serverMode)return persist(data);localStorage.setItem(KEY,JSON.stringify(data));return data;}

 const syncType=()=>{const type=form.elements.type.value;const restricted=['server','nas'].includes(type);if(restricted)form.elements.site.value='HQ';form.elements.site.disabled=restricted;$('#site-hint').textContent=restricted?'Server และ NAS จัดเก็บที่ HQ เท่านั้น':type==='router'?'Router ประจำ Site เช่น MikroTik':'';$('#computer-fields').hidden=!['pc','notebook'].includes(type);$('#custom-type-field').hidden=type!=='other';form.elements.customType.disabled=type!=='other';const hasAV=['pc','notebook','server'].includes(type);$('#antivirus-field').hidden=!hasAV;form.elements.antivirusActive.disabled=!hasAV;};

 form.onsubmit=async e=>{e.preventDefault();const val=Object.fromEntries(new FormData(form));val.site=form.elements.site.value;const computer=['pc','notebook'].includes(val.type);const device={...original,...val,id:original?.id||createId(),folders:computer?folders.map(f=>({...f,name:f.name.trim()})):[]};device.customType=val.type==='other'?(val.customType||'').trim():'';device.antivirusActive=['pc','notebook','server'].includes(val.type)?val.antivirusActive:null;for(const k of ['hostname','ip','mac','model','notes','os'])device[k]=device[k].trim();if(!computer)Object.assign(device,{os:'',startMA:'',endMA:'',ownerId:''});const errors=validateDevice(device,data.users,data.sites);if(data.devices.some(other=>other.id!==device.id&&other.hostname.toLowerCase()===device.hostname.toLowerCase()))errors.hostname='Hostname นี้มีในระบบแล้ว';displayErrors(form,errors);if(Object.keys(errors).length)return;const next={...data,devices:original?data.devices.map(x=>x.id===id?device:x):[...data.devices,device]};if(await commit(next)){$('#editor').close();renderPage();toast('บันทึกข้อมูลอุปกรณ์สำเร็จ');}};

 const d=data.devices.find(x=>x.id===id);if(!d)return;
 const computer=['pc','notebook'].includes(d.type);
 showDetails('รายละเอียดอุปกรณ์',`<dl class="detail-grid">${detail('ชื่อ / Hostname',d.hostname)}${detail('ประเภท',deviceType(d))}${detail('Site',siteName(d.site))}${detail('IP Address',d.ip)}${detail('MAC Address',d.mac)}${detail('รุ่น / รายละเอียด',d.model)}${['pc','notebook','server'].includes(d.type)?detail('Antivirus active',d.antivirusActive==='yes'?'Yes':d.antivirusActive==='no'?'No':'ยังไม่ระบุ'):''}${computer?detail('OS',d.os)+detail('Owner (using)',userName(d.ownerId))+detail('Start MA',dateText(d.startMA))+detail('End MA',dateText(d.endMA)):''}</dl>${computer?`<h3 class="form-section">Folders filesharing</h3>${d.folders.length?d.folders.map(f=>`<div class="breakdown"><span>${esc(f.name)}</span><span class="tag">${esc(f.permission)}</span></div>`).join(''):'<p class="muted">ยังไม่มี Folder ที่แชร์</p>'}`:''}<dl>${detail('หมายเหตุ',d.notes)}</dl>`,()=>deviceForm(id));
}
function issueTargetOptions(){
 return [['','เลือกอุปกรณ์หรือ Service'],...data.devices.map(d=>[`device:${d.id}`,`อุปกรณ์ · ${d.hostname} (${d.site})`]),...data.services.map(s=>[`service:${s.id}`,`Service · ${s.name}`]),['other','อื่นๆ']];
}
function issuesPage(){
 const customTargets=[...new Set(data.issues.filter(i=>i.targetKind==='other').map(i=>i.targetName))];
 const targetOptions=[['','ทุกอุปกรณ์ / Service'],...issueTargetOptions().slice(1),...customTargets.map(name=>[`other:${name}`,`อื่นๆ · ${name}`])];
 return heading('Issue Logs','บันทึกปัญหา ติดตามการแก้ไข และดูประวัติอุปกรณ์ / Service','issue')+`<section class="panel"><div class="filters issue-filters"><label class="field issue-search">ค้นหา<input id="issue-search" type="search" value="${esc(issueFilters.query)}" placeholder="ค้นหาปัญหา อุปกรณ์ Service หรือผู้แจ้ง…"></label><label class="field">สถานะ<select id="issue-status">${options([['','ทุกสถานะ'],['open','Open'],['resolved','Resolved']],issueFilters.status)}</select></label><label class="field">อุปกรณ์ / Service<select id="issue-target-filter">${options(targetOptions,issueFilters.target)}</select></label><label class="field">วันที่เกิดปัญหา ตั้งแต่<input id="issue-from" type="date" value="${esc(issueFilters.from)}"></label><label class="field">ถึงวันที่<input id="issue-to" type="date" value="${esc(issueFilters.to)}"></label><button class="secondary" id="issue-clear">ล้างตัวกรอง</button></div><div class="filter-error" id="issue-filter-error" role="alert"></div><div id="issue-results"></div></section><p class="muted">สถานะเปลี่ยนอัตโนมัติตามวันที่แก้ปัญหา · ตัวกรองช่วงวันที่ใช้วันที่เกิดปัญหา</p>`;
}
function bindIssues(){
 for(const [id,key,event] of [['issue-search','query','input'],['issue-status','status','change'],['issue-target-filter','target','change'],['issue-from','from','change'],['issue-to','to','change']])$('#'+id).addEventListener(event,e=>{issueFilters[key]=e.target.value;issueResults();});
 $('#issue-clear').onclick=()=>{Object.keys(issueFilters).forEach(k=>issueFilters[k]='');renderPage();};
 issueResults();
}
function issueResults(){
 const invalid=(issueFilters.from&&!isISODate(issueFilters.from))||(issueFilters.to&&!isISODate(issueFilters.to))||(issueFilters.from&&issueFilters.to&&issueFilters.from>issueFilters.to);
 $('#issue-filter-error').textContent=invalid?'กรุณาระบุช่วงวันที่ให้ถูกต้อง โดยวันเริ่มต้นต้องไม่อยู่หลังวันสิ้นสุด':'';
 if(invalid){$('#issue-results').innerHTML='<div class="empty">กรุณาแก้ไขช่วงวันที่เพื่อแสดงรายการ</div>';return;}
 const list=filterIssues(data,issueFilters);
 $('#issue-results').innerHTML=`<table class="issue-table"><thead><tr><th style="width:16%">วันที่เกิด / วันที่แก้</th><th style="width:23%">อุปกรณ์ / SERVICE</th><th style="width:12%">สถานะ</th><th style="width:15%">ผู้แจ้ง</th><th style="width:16%">NOTES</th><th style="width:18%">จัดการ</th></tr></thead><tbody>${list.length?list.map(i=>`<tr><td data-label="วันที่เกิด / วันที่แก้"><strong>${dateText(i.occurredOn)}</strong><div class="muted">แก้: ${dateText(i.resolvedOn)}</div></td><td data-label="อุปกรณ์ / Service"><strong>${esc(targetName(i,data))}</strong><div class="muted">${i.targetKind==='device'?'อุปกรณ์':i.targetKind==='service'?'Service':'อื่นๆ'}</div></td><td data-label="สถานะ"><span class="tag ${i.resolvedOn?'ok':'warn'}">${i.resolvedOn?'Resolved':'Open'}</span></td><td data-label="ผู้แจ้ง">${esc(reporterName(i,data))}</td><td data-label="Notes"><div class="issue-summary">${esc(i.notes.length>100?i.notes.slice(0,100)+'…':i.notes)}</div></td><td><div class="actions"><button class="action" data-issue-view="${esc(i.id)}">ดู</button><button class="action" data-issue-edit="${esc(i.id)}">แก้ไข</button><button class="action delete" data-issue-delete="${esc(i.id)}">ลบ</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty" style="grid-column:1/-1">ไม่พบ Issue Logs ที่ตรงกับตัวกรอง</td></tr>'}</tbody></table><div class="panel-foot">พบ ${list.length} จาก ${data.issues.length} รายการ</div>`;
 document.querySelectorAll('[data-issue-view]').forEach(b=>b.onclick=()=>issueDetails(b.dataset.issueView));document.querySelectorAll('[data-issue-edit]').forEach(b=>b.onclick=()=>issueForm(b.dataset.issueEdit));document.querySelectorAll('[data-issue-delete]').forEach(b=>b.onclick=()=>confirmDelete('issue',b.dataset.issueDelete));
}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function issueForm(id){
 const original=data.issues.find(i=>i.id===id);
 const i=original||{occurredOn:localDate(),resolvedOn:'',targetKind:'',targetId:'',targetName:'',reporterKind:'',reporterId:'',reporterName:'',notes:''};
 const target=i.targetKind==='other'?'other':i.targetKind?`${i.targetKind}:${i.targetId}`:'';
 const reporter=i.reporterKind==='other'?'other':i.reporterId;
 const form=showEditor(original?'แก้ไข Issue Log':'เพิ่ม Issue Log',`<div class="form-grid">${field('occurredOn','วันที่เกิดปัญหา',i.occurredOn,'date',true)}${field('resolvedOn','วันที่แก้ปัญหา (เว้นว่างหากยังไม่เสร็จ)',i.resolvedOn,'date')}${selectField('target','อุปกรณ์หรือ Service *',issueTargetOptions(),target)}${selectField('reporter','ผู้แจ้ง *',[['','เลือกผู้แจ้ง'],...data.users.map(u=>[u.id,`${u.name} · ${u.site}`]),['other','อื่นๆ']],reporter)}<div id="issue-custom-target">${field('targetName','ชื่ออุปกรณ์หรือ Service',i.targetKind==='other'?i.targetName:'','text',true)}</div><div id="issue-custom-reporter">${field('reporterName','ชื่อผู้แจ้ง',i.reporterKind==='other'?i.reporterName:'','text',true)}</div><label class="field full">Notes · รายละเอียดปัญหาและการแก้ไข *<textarea name="notes" rows="6" maxlength="10000" required>${esc(i.notes)}</textarea><span class="field-error" data-error="notes" id="error-notes"></span></label></div><p class="muted">${data.services.length?'เลือก Service ที่มีอยู่ หรือใช้ “อื่นๆ” เพื่อกรอกชื่อเอง':'ยังไม่มีรายการ Service ในข้อมูลเดิม เลือก “อื่นๆ” เพื่อระบุชื่อ Service ได้'} · ไม่ระบุวันที่แก้ = Open</p>`);
 const sync=()=>{const customTarget=form.elements.target.value==='other',customReporter=form.elements.reporter.value==='other';$('#issue-custom-target').hidden=!customTarget;form.elements.targetName.disabled=!customTarget;$('#issue-custom-reporter').hidden=!customReporter;form.elements.reporterName.disabled=!customReporter;};
 form.elements.target.onchange=sync;form.elements.reporter.onchange=sync;sync();
 form.onsubmit=async e=>{
  e.preventDefault();const values=Object.fromEntries(new FormData(form));
  const selected=values.target,split=selected.indexOf(':');
  const targetKind=selected==='other'?'other':split>=0?selected.slice(0,split):'';
  const targetId=split>=0?selected.slice(split+1):'';
  const reporterKind=values.reporter==='other'?'other':values.reporter?'user':'';
  const issue={...original,id:original?.id||createId(),occurredOn:values.occurredOn,resolvedOn:values.resolvedOn,targetKind,targetId,targetName:targetKind==='other'?(values.targetName||'').trim():'',reporterKind,reporterId:reporterKind==='user'?values.reporter:'',reporterName:reporterKind==='other'?(values.reporterName||'').trim():'',notes:values.notes.trim()};
  if(targetKind!=='other')issue.targetName=targetName(issue,data)||'';
  if(reporterKind==='user')issue.reporterName=reporterName(issue,data)||'';
  const errors=validateIssue(issue,data);displayErrors(form,errors);if(Object.keys(errors).length)return;
  if(await commit({...data,issues:original?data.issues.map(x=>x.id===id?issue:x):[...data.issues,issue]})){$('#editor').close();renderPage();toast('บันทึก Issue Log สำเร็จ');}
 };
}
function issueDetails(id){
 const i=data.issues.find(x=>x.id===id);if(!i)return;
 showDetails('รายละเอียด Issue Log',`<span class="tag ${i.resolvedOn?'ok':'warn'}">${i.resolvedOn?'Resolved':'Open'}</span><dl class="detail-grid">${detail('วันที่เกิดปัญหา',dateText(i.occurredOn))}${detail('วันที่แก้ปัญหา',dateText(i.resolvedOn))}${detail('อุปกรณ์หรือ Service',targetName(i,data))}${detail('ผู้แจ้ง',reporterName(i,data))}</dl><dl>${detail('Notes · รายละเอียดปัญหาและการแก้ไข',i.notes)}</dl>`,()=>issueForm(id));
}

function downloadData(value,name) {
 const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function dataTransfer() {
 const form=showEditor('นำเข้า / ส่งออกข้อมูล',`<p>ข้อมูลเดิมในเบราว์เซอร์จะไม่ถูกลบ การนำเข้าจะรวมรายการตาม ID หากข้อมูล ID เดียวกันต่างกัน ระบบจะหยุดและเก็บข้อมูลเดิมบนเซิร์ฟเวอร์ไว้</p><p><button type="button" class="secondary" id="export-server">ส่งออกข้อมูลปัจจุบัน</button></p><p><button type="button" class="secondary" id="export-legacy">ส่งออก localStorage เดิม</button></p><label class="field">ไฟล์ JSON ที่ต้องการนำเข้า<input type="file" id="import-file" accept=".json,application/json"></label><p id="transfer-result" role="status"></p><p>ก่อนนำเข้าระบบจะส่งออกสำเนาข้อมูลปัจจุบันให้เก็บไว้ และเก็บประวัติในฐานข้อมูลด้วย</p>`);
 form.querySelector('button[type="submit"]').textContent='นำเข้าข้อมูล';
 $('#export-server').onclick=()=>downloadData(data,'jpkinventory-export.json');
 $('#export-legacy').onclick=()=>{try{const old=legacyData();if(!old)throw Error('ไม่พบข้อมูลเดิมที่ origin นี้');downloadData(old,'jpkinventory-localstorage.json');}catch(e){$('#transfer-result').textContent=e.message;}};
 if(!canWrite()){form.querySelector('button[type="submit"]').hidden=true;$('#import-file').disabled=true;}
 form.onsubmit=async e=>{
  e.preventDefault();if(saving||!canWrite())return;
  try{
   const file=$('#import-file').files[0];if(!file)throw Error('กรุณาเลือกไฟล์ JSON');if(file.size>8*1024*1024)throw Error('ไฟล์ต้องไม่เกิน 8 MiB');
   const incoming=JSON.parse(await file.text());downloadData(data,'jpkinventory-before-import.json');
   saving=true;form.querySelector('button[type="submit"]').disabled=true;
   data=await importData(incoming);$('#editor').close();shell();toast('นำเข้าข้อมูลสำเร็จ');
  }catch(e){$('#transfer-result').textContent=e.message;}
  finally{saving=false;form.querySelector('button[type="submit"]').disabled=false;}
 };
}
async function start() {
 if(location.protocol!=='file:'){try{currentAccount=(await accountRequest('auth/me')).user;}catch(e){authScreen(false,e.message==='Please sign in'?'':e.message);return;}if(currentAccount.mustChange){authScreen(true);return;}}
 try{await initializeStorage();data=load();failure='';}
 catch(e){failure='โหลดข้อมูลไม่สำเร็จ: '+e.message+' กรุณาโหลดหน้าใหม่ ข้อมูลเดิมจะไม่ถูกเขียนทับ';}
 shell();
}
const permissionObserver=new MutationObserver(()=>applyPermissions());
permissionObserver.observe($('#app'),{childList:true,subtree:true});
start();

})();
</script>
</body>
</html>
